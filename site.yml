---
# Play 1 - Facts, set_fact and templates on all hosts
- name: Gather information and build a report (all hosts)
  hosts: all
  gather_facts: true

  vars:
    # Play-level variable
    demo_banner: "Ansible from zero to hero"

  pre_tasks:
    - name: Print the banner
      ansible.builtin.debug:
        msg: "{{ demo_banner }} - target {{ inventory_hostname }} ({{ environment_name }})"
      tags: [always]

  roles:
    - role: common
      tags: [common]

  post_tasks:
    - name: Read the generated report
      ansible.builtin.slurp:
        src: "{{ report_dir }}/{{ common_report_filename }}"
      register: report_content
      tags: [report]

    - name: Show the report
      ansible.builtin.debug:
        msg: "{{ (report_content.content | b64decode).split('\n') }}"
      tags: [report]

# Play 2 - For every host: get its kubeconfig, then deploy the app on its cluster
- name: Kubernetes workload on the cluster of each host
  hosts: all
  gather_facts: true

  roles:
    - role: kubeconfig
      tags: [kubeconfig, k8s]
    - role: k8s_app
      tags: [k8s]
