---
- name: Create the namespace {{ k8s_namespace }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_namespace }}"

- name: Apply the ConfigMap from the template
  kubernetes.core.k8s:
    state: present
    template: configmap.yml.j2

- name: Apply the Pod from the template and wait until it is Ready
  kubernetes.core.k8s:
    state: present
    template: pod.yml.j2
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ k8s_wait_timeout }}"
  register: k8s_apply

- name: Read the pod status
  kubernetes.core.k8s_info:
    kind: Pod
    name: "{{ k8s_pod_name }}"
    namespace: "{{ k8s_namespace }}"
  register: pod_info

- name: Store the pod details (set_fact)
  ansible.builtin.set_fact:
    pod_phase: "{{ pod_info.resources[0].status.phase }}"
    pod_ip: "{{ pod_info.resources[0].status.podIP | default('n/a') }}"

- name: Show the result
  ansible.builtin.debug:
    msg:
      - "Pod {{ k8s_namespace }}/{{ k8s_pod_name }} is {{ pod_phase }} (IP {{ pod_ip }})"
      - "Try: kubectl -n {{ k8s_namespace }} port-forward pod/{{ k8s_pod_name }} 8080:{{ k8s_pod_port }}"
